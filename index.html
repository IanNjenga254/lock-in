<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOCKDOWN OS v3</title>

<style>
:root{
--bg:#070b12;
--card:#111827;
--accent:#00ffd5;
--text:#e6f1ff;
--muted:#8fa3c7;
--danger:#ff5c7a;
}

*{box-sizing:border-box;font-family:Inter,system-ui}
body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden}

/* NAV */
nav{display:flex;gap:10px;padding:15px;background:#04070c;position:sticky;top:0;z-index:5}
button{background:#121a2a;border:none;color:var(--text);padding:10px 15px;border-radius:10px;cursor:pointer}
button:hover{background:#1c2438}

.panel{display:none;padding:25px;animation:fade .6s}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1}}

.card{background:var(--card);padding:20px;margin:15px 0;border-radius:18px;box-shadow:0 0 25px #00000050}
.progress{background:#1b253a;height:14px;border-radius:20px}
.bar{background:var(--accent);height:14px;border-radius:20px;width:0%}

input,textarea{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:none;background:#1b253a;color:white}

.small{color:var(--muted);font-size:14px}

/* PARTICLES */
canvas{position:fixed;top:0;left:0;z-index:-1}

/* MODAL */
#intro{position:fixed;inset:0;background:#000000d0;display:flex;align-items:center;justify-content:center}
.modal{background:#111827;padding:30px;border-radius:20px;width:320px;text-align:center}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<nav>
<button onclick="tab('dash')">Mission</button>
<button onclick="tab('today')">Today</button>
<button onclick="tab('missions')">Missions</button>
<button onclick="tab('journal')">Journal</button>
<button onclick="tab('money')">Income</button>
<button onclick="tab('stats')">Analytics</button>
</nav>

<!-- INTRO -->
<div id="intro">
<div class="modal">
<h2>Welcome to LOCKDOWN OS</h2>
<p>This system helps you build skills, income and discipline.</p>
<button onclick="start()">Start Mission</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dash" class="panel active">
<h1 id="quote"></h1>

<div class="card">
<h2>Level <span id="level"></span></h2>
<div class="progress"><div id="xpBar" class="bar"></div></div>
<p><span id="xp"></span> XP</p>
</div>

<div class="card">
<h3>🔥 Streak</h3>
<p id="streak"></p>
<button onclick="checkIn()">Daily Check-In (+5XP)</button>
</div>
</div>

<!-- TODAY -->
<div id="today" class="panel">
<h2>Daily Planner</h2>
<textarea id="planner" rows="8"></textarea>
<button onclick="savePlanner()">Save</button>
</div>

<!-- MISSIONS -->
<div id="missions" class="panel">
<h2>Missions</h2>
<label><input type="checkbox" onchange="task()"> Trading lesson</label><br>
<label><input type="checkbox" onchange="task()"> TryHackMe room</label><br>
<label><input type="checkbox" onchange="task()"> Send proposal</label>
</div>

<!-- JOURNAL -->
<div id="journal" class="panel">
<h2>Journal</h2>
<textarea id="journalText" rows="8"></textarea>
<button onclick="saveJournal()">Save</button>
</div>

<!-- MONEY -->
<div id="money" class="panel">
<h2>Income Tracker</h2>
<input id="amount" placeholder="Amount">
<button onclick="addIncome()">Add</button>
<h3>Total: $<span id="totalMoney">0</span></h3>
</div>

<!-- STATS -->
<div id="stats" class="panel">
<h2>Analytics</h2>
<canvas id="chart" height="200"></canvas>
</div>

<script>
/* NAV */
function tab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}

/* ONBOARDING */
if(localStorage.getItem('started')) intro.style.display='none'
function start(){localStorage.setItem('started',1);intro.style.display='none'}

/* XP SYSTEM */
let xp=parseInt(localStorage.getItem('xp')||0)
let streak=parseInt(localStorage.getItem('streak')||0)

function addXP(x){xp+=x;localStorage.setItem('xp',xp);updateXP()}
function level(){return Math.floor(xp/100)+1}
function updateXP(){
xpBar.style.width=(xp%100)+'%'
xp.innerText=xp
level.innerText=level()
}

function checkIn(){streak++;localStorage.setItem('streak',streak);streak.innerText=streak+" days";addXP(5)}
function task(){addXP(10)}
streak.innerText=streak+" days"
updateXP()

/* PLANNER + JOURNAL */
planner.value=localStorage.getItem('planner')||''
journalText.value=localStorage.getItem('journal')||''
function savePlanner(){localStorage.setItem('planner',planner.value)}
function saveJournal(){localStorage.setItem('journal',journalText.value)}

/* INCOME */
let money=parseFloat(localStorage.getItem('money')||0)
totalMoney.innerText=money
function addIncome(){money+=parseFloat(amount.value||0);localStorage.setItem('money',money);totalMoney.innerText=money}

/* DAILY QUOTE TYPING */
let quotes=["Small wins compound.","Consistency beats motivation.","Discipline creates freedom."]
let q=quotes[Math.floor(Math.random()*quotes.length)]
let i=0;setInterval(()=>{if(i<q.length)quote.innerText+=q[i++]},40)

/* PARTICLES */
const c=document.getElementById("bg");const ctx=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
let particles=[...Array(80)].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2}))
function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#00ffd533";particles.forEach(p=>{p.y+=.2;if(p.y>c.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill()});requestAnimationFrame(draw)}draw()

/* NOTIFICATIONS */
if(Notification.permission!=="granted")Notification.requestPermission()
setTimeout(()=>{new Notification("Open LOCKDOWN OS & do the work 💪")},8000)

/* SIMPLE CHART */
let ctx2=document.getElementById('chart').getContext('2d')
ctx2.fillStyle="#00ffd5";ctx2.fillRect(10,200-xp%200,40,xp%200)
</script>
</body>
</html>
